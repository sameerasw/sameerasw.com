name: Sync Data to Cloudflare KV

on:
  push:
    branches: [main]
    paths:
      - 'public/*.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Push changed JSON to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=$(ls public/*.json)
          else
            files=$(git diff --name-only HEAD~1 HEAD -- 'public/*.json')
          fi
          echo "Syncing: $files"
          [ -n "$files" ] && .github/scripts/push-data-to-kv.sh $files
